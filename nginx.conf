## NGINX config snippet for FXTE OS
## Add this inside your server {} block

server {
    listen 80;
    listen 443 ssl;
    server_name your-domain.com;
    root /var/www/fxte;
    index fxte.html;

    # Exact routes
    location = /         { try_files /fxte.html =404; }
    location = /fxte     { try_files /fxte.html =404; }
    location = /overview { try_files /overview.html =404; }
    location = /audit    { try_files /audit.html =404; }
    location = /ranking  { try_files /ranking.html =404; }
    location = /symbol   { try_files /symbol.html =404; }
    location = /market   { try_files /market.html =404; }
    location = /operation{ try_files /operation.html =404; }
    location = /alert    { try_files /alert.html =404; }

    # Static files (js, css, etc.)
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # Deny access to hidden files
    location ~ /\. { deny all; }
}
